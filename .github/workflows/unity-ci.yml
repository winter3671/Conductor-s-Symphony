name: Unity CI

on:
  push:
    branches:
      - master
      - ci/**
      - 'feat/**'
  pull_request:
    branches:
      - master

jobs:
  unity:
    name: Unity Editor CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: |
            Library/PackageCache
            Library/ArtifactDatabase
            Library/SourceAssetDB
            Library/ScriptAssemblies
          key: unity-packages-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            unity-packages-

      - name: Validate Unity license secrets
        run: |
          if [ -z "${UNITY_LICENSE}" ] && [ -z "${UNITY_SERIAL}" ]; then
            echo "Missing Unity activation secrets.\nSet UNITY_LICENSE or UNITY_SERIAL, plus UNITY_EMAIL and UNITY_PASSWORD in repo Secrets.";
            exit 1;
          fi
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Run Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          projectPath: .
          unityVersion: 6000.5.5f1
