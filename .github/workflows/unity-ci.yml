name: Unity CI

on:
  push:
    branches:
      - master
      - ci/**
      - 'feat/**'
  pull_request:
    branches:
      - master

jobs:
  unity:
    name: Unity Editor CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity packages
        uses: actions/cache@v4
        with:
          path: |
            Library/PackageCache
            Library/ArtifactDatabase
            Library/SourceAssetDB
            Library/ScriptAssemblies
          key: unity-packages-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            unity-packages-

      - name: Run Unity Builder
        uses: game-ci/unity-builder@v3
        with:
          targetPlatform: StandaloneLinux64
          projectPath: .
          unityVersion: 6000.5.5f1
